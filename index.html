<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JustShare — da telefono a telefono, senza server</title>
    <meta name="description" content="Share files and text with nearby devices: direct, end-to-end encrypted, nothing stored on servers. Works offline with the camera. Open source by JustApps." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://share.justapps.it/" />
    <meta property="og:title" content="JustShare — phone to phone, through no one" />
    <meta property="og:description" content="Direct, end-to-end encrypted file sharing between nearby devices. Works offline with the camera." />
    <meta property="og:image" content="https://share.justapps.it/icons/icon-512.png" />
    <script>
      try {
        var t = localStorage.getItem('justshare-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>JustShare needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
